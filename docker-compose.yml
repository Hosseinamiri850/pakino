services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pakino
      POSTGRES_PASSWORD: pakino
      POSTGRES_DB: pakino
    # 5433 on the host: a native Windows PostgreSQL can occupy 5432; override
    # with DATABASE_URL=postgres://pakino:pakino@localhost:5433/pakino
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./drizzle:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pakino"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: pakino
      MINIO_ROOT_PASSWORD: pakino12345
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  createbucket:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 pakino pakino12345;
      mc mb --ignore-existing local/pakino;
      mc anonymous set download local/pakino;
      exit 0;
      "

volumes:
  pgdata:
  miniodata:
