# Production overlay: full application stack via Docker.
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Local development stays:  docker compose up -d  +  npm run dev
#
# Inside the compose network services talk by name (postgres/redis/minio);
# the host-side Postgres port mapping (5433) is unchanged — a native Windows
# PostgreSQL owns host port 5432.

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      DATABASE_URL: ${DATABASE_URL:-postgres://pakino:pakino@postgres:5432/pakino}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-pakino}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-pakino12345}
      S3_BUCKET: ${S3_BUCKET:-pakino}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET to 32+ random bytes}
      ZARINPAL_MERCHANT_ID: ${ZARINPAL_MERCHANT_ID:-}
      ZARINPAL_CALLBACK_URL: ${ZARINPAL_CALLBACK_URL:-http://localhost:3000/api/payments/callback}
      ZARINPAL_SANDBOX: ${ZARINPAL_SANDBOX:-true}
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/fa >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL_DOCKER:-postgres://pakino:pakino@postgres:5432/pakino}
      REDIS_URL: ${REDIS_URL_DOCKER:-redis://redis:6379}
      QUEUE_NAME: ${QUEUE_NAME:-pakino:jobs}
      S3_ENDPOINT: ${S3_ENDPOINT_DOCKER:-http://minio:9000}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-pakino}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-pakino12345}
      S3_BUCKET: ${S3_BUCKET:-pakino}
      MAX_IMAGE_SIZE: ${MAX_IMAGE_SIZE:-10485760}
      MAX_VIDEO_SIZE: ${MAX_VIDEO_SIZE:-524288000}
      MAX_VIDEO_DURATION: ${MAX_VIDEO_DURATION:-300}
      FILE_RETENTION_HOURS: ${FILE_RETENTION_HOURS:-24}
      CREDITS_PER_IMAGE: ${CREDITS_PER_IMAGE:-5}
      CREDITS_PER_VIDEO_10_SECONDS: ${CREDITS_PER_VIDEO_10_SECONDS:-10}
      MAX_JOB_ATTEMPTS: ${MAX_JOB_ATTEMPTS:-3}
      RECOVERY_INTERVAL_SECONDS: ${RECOVERY_INTERVAL_SECONDS:-60}
    volumes:
      - tmpmedia:/tmp
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

  redis:
    # Redis is a best-effort TRANSPORT here: durability comes from the DB
    # outbox, so no persistence config. See docs/JOB_RELIABILITY_PLAN.md.
    restart: unless-stopped

  minio:
    restart: unless-stopped

volumes:
  tmpmedia:
